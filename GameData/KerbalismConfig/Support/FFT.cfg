        type = 0                  
        resource = Regolith
        min_abundance = 0.00005
        rate = 0.20             
        ec_rate = 6500.0        
    }

    // Process 2: Heavy In-Situ Volatile Extraction (Helium-3 Pyrolysis)
    MODULE
    {
        name = Harvester
        title = Heavy He-3 Volatile Extractor
        type = 0                  // 0 = Surface crustal harvesting
        resource = LqdHe3
        min_abundance = 0.00005   // Minimum 0.005% surface concentration required
        rate = 0.0004            // High-throughput cryogenic yield
        ec_rate = 10000.0        // 10.0 MW continuous pyrolysis & thermal fluidization
    }
}

@PART[fft-antimatter-factory-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleResourceConverter],* {}
    !MODULE[ModuleSystemHeatConverter],* {}

    // Mode 1: High-energy Pair Production via Liquid Hydrogen
    MODULE
    {
        name = ProcessController
        resource = _AntimatterLH2
        title = Antimatter Synthesis (LH2)
        capacity = 1.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 120000.0 // 120 MW continuous power
        }
        INPUT_RESOURCE
        {
            name = LiquidHydrogen
            rate = 12.5 // ~12.5 L/s
        }
        OUTPUT_RESOURCE
        {
            name = Antimatter
            rate = 0.000125 // Micro-grams generated per second
            dump = false
        }
    }

    // Mode 2: Fission Pellet-catalyzed Antimatter Production
    MODULE
    {
        name = ProcessController
        resource = _AntimatterPellets
        title = Antimatter Synthesis (Fission Pellets)
        capacity = 1.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 45000.0 // 45 MW continuous power
        }
        INPUT_RESOURCE
        {
            name = FissionPellets
            rate = 0.05
        }
        OUTPUT_RESOURCE
        {
            name = Antimatter
            rate = 0.00025 // Faster return rate due to heavy core target collisions
            dump = false
        }
    }
}