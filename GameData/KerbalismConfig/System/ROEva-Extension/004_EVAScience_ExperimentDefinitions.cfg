// =====================================================================
// 004_EVAScience_ExperimentDefinitions.cfg
// ---------------------------------------------------------------------
// Defines the underlying stock-style EXPERIMENT_DEFINITION for each
// custom experiment_id used in 002_EVAScience_Kits.cfg, and sets
// REALISTIC durations based on real-world EVA / field-geophysics
// analogs rather than arbitrary numbers.
//
// THE MATH: Kerbalism computes an experiment's data size in Mb as
//     size = baseValue * dataScale
// and how long it takes to complete as
//     duration (s) = size (Mb) / data_rate (Mb/s)
//
// So for a target realistic duration, pick a size, then:
//     data_rate = size / duration
//
// Below, each entry lists the REAL-WORLD reference used, the chosen
// duration, and the resulting data_rate you plug into the Experiment
// module's data_rate field in 002. (You can also use Kerbalism's own
// KERBALISM_EXPERIMENT_VALUES convenience node to specify size+duration
// directly and let its patch system compute data_rate for you - see
// the note at the bottom - but hand-computing is more transparent when
// you're hand-tuning realism.)
// =====================================================================

// ---------------------------------------------------------------------
// 1) SEISMOMETER  -  real-world reference: portable seismic refraction
//    survey, single station setup+listen ~15-25 min (Apollo ALSEP
//    long-term monitoring is a different, multi-year use case - this
//    kit represents a single field reading, not a permanent station)
//    -> duration = 1200s (20 min), size = 6 Mb -> data_rate = 0.005
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaSeismicScan
	title = EVA Seismic Reading
	baseValue = 6
	scienceCap = 12
	dataScale = 1
	requireAtmosphere = False
	situationMask = 16       // Surface (stock bitmask value for SrfLanded)
	biomeMask = 16           // varies by biome - encourages moving between sites
}

// matching Experiment module fields to use in 002:
//   data_rate = 0.005   (Mb/s -> 6 Mb / 1200 s)
//   ec_rate   = 0.01    (12 EC total over the reading - fits the 50 EC
//                        onboard battery already defined on the kit)

// ---------------------------------------------------------------------
// 2) MAGNETOMETER  -  real-world reference: portable field magnetometer
//    station reading, ~5-10 min once positioned
//    -> duration = 480s (8 min), size = 3 Mb -> data_rate = 0.00625
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaMagnetometerScan
	title = EVA Magnetometer Reading
	baseValue = 3
	scienceCap = 7
	dataScale = 1
	situationMask = 16
	biomeMask = 16
}
//   data_rate = 0.00625
//   ec_rate   = 0.01   (4.8 EC total - light battery, ~20 EC capacity is enough)

// ---------------------------------------------------------------------
// 3) REGOLITH / SOIL SAMPLE  -  real-world reference: Apollo documented
//    sample scoop incl. photography and bagging, ~8-12 min per sample
//    -> duration = 600s (10 min)
//    this is a SAMPLE (sample_mass set), not transmissible data, so
//    "size" here represents fill-rate toward the sample_mass/reservoir
//    rather than Mb of transmissible data.
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaRegolithSample
	title = EVA Regolith Sample
	baseValue = 8
	scienceCap = 16
	dataScale = 1
	situationMask = 16
	biomeMask = 16
}
// In 002's MODULE Experiment for this kit:
//   sample_mass       = 0.001   (1 kg per scoop - realistic single-sample size,
//                                 much lighter than stock's 25kg "big" surface sample)
//   sample_collecting = true
//   data_rate         = 0.0017  (fills the sample over 600s)
//   ec_rate           = 0.005   (kerbal-powered scooping, minimal EC draw)

// ---------------------------------------------------------------------
// 4) MICROMETEORITE IMPACT PLATE  -  real-world reference: passive
//    exposure collectors (LDEF-style) need long real exposure times to
//    catch anything statistically meaningful - this is the one
//    experiment where "realistic" genuinely means LONG, not a quick
//    field reading.
//    -> duration = 259200s (3 real days)
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaMicrometeoriteScan
	title = EVA Micrometeorite Exposure
	baseValue = 10
	scienceCap = 25
	dataScale = 1
	requireAtmosphere = False   // airless bodies only, see requires in 002
	situationMask = 16
	biomeMask = 16
}
//   data_rate = 0.0000386   (10 Mb / 259200 s)
//   ec_rate   = 0.0004      (~100 EC over 3 days - give this kit a bigger
//                            onboard battery, ~120 EC, since it runs long)
//   crew_prepare = true, crew_operate blank - see the crew_operate vs
//   crew_prepare rule in 002_EVAScience_Kits.cfg. This one runs unattended
//   once started, for the full 3 days, sitting in the Field Case or a
//   kerbal's inventory - it does not need a kerbal standing there.

// ---------------------------------------------------------------------
// 5) HEAT FLOW PROBE  -  real-world reference: Apollo Heat Flow
//    Experiment required drilling (~1+ hour) then WEEKS of thermal
//    equilibration before the reading was valid (disturbed regolith
//    needs to re-settle thermally). Compromise for gameplay: model the
//    drilling as the active EVA portion, and the equilibration as a
//    background-ticking wait.
//    -> duration = 129600s (36 hours)
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaHeatFlowScan
	title = EVA Heat Flow Probe
	baseValue = 14
	scienceCap = 30
	dataScale = 1
	situationMask = 16
	biomeMask = 16
}
//   data_rate = 0.000108   (14 Mb / 129600 s)
//   ec_rate   = 0.0003     (~39 EC over 36h - again, bigger battery: ~50 EC)
//   crew_prepare = Engineer (drilling the hole), crew_operate blank,
//   crew_reset = Scientist (validates a disturbed reading) - runs
//   unattended for the 36h equilibration once drilled.

// ---------------------------------------------------------------------
// 6) RADIATION DOSIMETER  -  real-world reference: passive dosimeter
//    badges integrate over the full EVA/mission, not an instant
//    reading - a short check gives you a low-confidence number, a full
//    EVA-length integration gives you the real value.
//    -> duration = 21600s (6 hours - a full EVA session)
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaRadDosimeter
	title = EVA Radiation Dosimeter
	baseValue = 9
	scienceCap = 20
	dataScale = 1
	situationMask = 48       // Surface OR flying/space - works everywhere
	biomeMask = 0            // not biome-dependent, it's about radiation environment
}
//   data_rate = 0.000417   (9 Mb / 21600 s)
//   ec_rate   = 0.0005     (~11 EC over 6h)
//   crew_prepare = true, crew_operate blank - clip it on and go about
//   other business, it keeps integrating passively for the 6h reading.

// ---------------------------------------------------------------------
// 7) ATMOSPHERIC GAS ANALYZER  -  real-world reference: instruments
//    like Curiosity's SAM or the Huygens GCMS take 20-90 min per
//    capture-and-analyze cycle
//    -> duration = 2700s (45 min)
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaAtmoAnalysis
	title = EVA Atmospheric Analysis
	baseValue = 11
	scienceCap = 24
	dataScale = 1
	requireAtmosphere = True
	situationMask = 16
	biomeMask = 0
}
//   sample_mass = 0.00015  (150g captured gas sample - light)
//   data_rate   = 0.00407  (11 Mb / 2700 s)
//   ec_rate     = 0.006    (~16 EC over 45 min - the pump/heater draws more)

// ---------------------------------------------------------------------
// 8) GRAVIMETER  -  real-world reference: Apollo 17's Traverse
//    Gravimeter Experiment, ~5-10 min per station once leveled
//    -> duration = 420s (7 min)
// ---------------------------------------------------------------------
EXPERIMENT_DEFINITION
{
	id = evaGravimeterScan
	title = EVA Gravimeter Reading
	baseValue = 5
	scienceCap = 14
	dataScale = 1
	situationMask = 16
	biomeMask = 16
}
//   data_rate = 0.0119   (5 Mb / 420 s)
//   ec_rate   = 0.008    (~3.4 EC - quick, precise reading)

// =====================================================================
// SUMMARY TABLE (real-world basis -> chosen duration)
// =====================================================================
/*
Experiment            Real-world basis                          Duration
---------------------------------------------------------------------------
Seismometer            Field seismic refraction survey            20 min
Magnetometer           Portable magnetometer station reading       8 min
Regolith Sample        Apollo documented scoop sample              10 min
Micrometeorite Plate   Passive exposure collector (LDEF-style)     3 days
Heat Flow Probe        Apollo HFE drill + thermal equilibration    36 hours
Radiation Dosimeter    Passive dosimeter, full-EVA integration      6 hours
Atmo Gas Analyzer      SAM/GCMS-style capture+analyze cycle        45 min
Gravimeter             Apollo 17 Traverse Gravimeter reading        7 min
*/

// =====================================================================
// ADDITIONAL CONSIDERATIONS
// =====================================================================
/*
1) [RESOLVED] LONG-DURATION KITS AND THE SUIT-INVENTORY PROBLEM
   Fixed by splitting experiments into two groups (see the rule-of-thumb
   block at the top of 002_EVAScience_Kits.cfg):
     - crew_operate: short (7-45 min) readings needing continuous,
       hands-on presence - Seismometer, Magnetometer, Gravimeter,
       Regolith Sample, Atmospheric Analyzer.
     - crew_prepare: long (6h-3 days) passive readings that a kerbal
       starts once and then run unattended - Micrometeorite Plate, Heat
       Flow Probe, Radiation Dosimeter. These tick via Kerbalism's
       background simulation regardless of whether a kerbal is nearby,
       as long as the situation requirements keep being met - so they
       can sit in the Field Case (parked on the surface) or just stay in
       a kerbal's pocket while they go do something else nearby.

2) INTERRUPTION HANDLING
   What happens if the kerbal reboards the lander mid-reading, or the
   Container gets moved? crew_reset lets you require a Scientist to
   validate/restart a disturbed reading rather than silently keeping
   partial (possibly invalid) data - already applied to Heat Flow above,
   since real disturbed-hole data was famously unreliable on Apollo 15.
   Worth considering the same for the Micrometeorite Plate if it gets
   moved mid-exposure (a jostled collector could plausibly contaminate
   the reading) - a plain crew_reset = true (any kerbal re-arms it) would
   be enough there, since it doesn't need Scientist-level interpretation.

3) SCIENTIST SPEED/QUALITY BONUS (in place of the dropped slot-count idea)
   Gravimeter already requires a Scientist@1 to operate. Consider the
   same treatment for Heat Flow Probe's crew_prepare if you want an
   Engineer AND a Scientist both meaningfully involved in that one
   (Engineer drills, Scientist later validates via crew_reset) - already
   set up that way above.
*/
   If you'd rather not hand-compute data_rate every time you tweak a
   duration, Kerbalism supports a convenience node that does it for you:

   @KERBALISM_EXPERIMENT_VALUES:NEEDS[EVAScienceKits,FeatureScience]
   {
       %EVAScienceKits
       {
           evaSeismicScan { size = 6    duration = 1200   }
           evaHeatFlowScan { size = 14  duration = 129600 }
           // etc.
       }
   }

   This is handled by Kerbalism's own patch system and saves you from
   redoing the division by hand every time you rebalance - worth
   switching to once your numbers stabilize. (Requires your mod's
   GameData folder to be named "EVAScienceKits" for the :NEEDS check to
   detect it, or change the tag to match your actual folder name.)
*/