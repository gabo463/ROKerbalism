// =================================================================================
//  Sandcastle 2.5m Space Smelter (wbiELSmelter)
//  Includes Route 2: Regolith Volatile Pyrolysis & Polymer Hydrogenation
//  Profile: KerbalismSupport (1.0 Capacity)
//
//  Dry Mass: 7,500 kg
//  Diameter: 2.5 m
//  EC Storage: 10,000 EC
//
//  Mode 1: Regolith Smelter (Metal)
//    - Process: carbothermal metal smelter (_MetalSmelter)
//    - Thermal Energy Draw: 45 kW (45 EC/s continuous)
//    - Operating Temperature: ~1500 K (1227 °C)
//    - Feed Throughput: 0.100 unit/s Regolith (~0.160 kg/s)
//    - Refined Yield: 0.003 unit/s Metal (~0.0234 kg/s)
//
//  Mode 2: Trace Refining (Rare Metals)
//    - Process: molten salt rare metals smelter (_RareMetalsSmelter)
//    - Thermal Energy Draw: 75 kW (75 EC/s continuous)
//    - Operating Temperature: ~1800 K (1527 °C)
//    - Feed Throughput: 1.000 unit/s Regolith (~1.600 kg/s)
//    - Refined Yield: 0.001 unit/s RareMetals (~0.0078 kg/s)
//
//  Mode 3: Silicate Reduction (Silicon)
//    - Process: silicate reduction silicon smelter (_SiliconSmelter)
//    - Thermal Energy Draw: 60 kW (60 EC/s continuous)
//    - Operating Temperature: ~1700 K (1427 °C)
//    - Feed Throughput: 0.200 unit/s Regolith (~0.320 kg/s)
//    - Refined Yield: 0.020 unit/s Silicon (~0.0466 kg/s)
//
//  Mode 4: Alumina Electrolysis (Aluminium)
//    - Process: alumina electrolysis aluminium smelter (_AluminiumSmelter)
//    - Thermal Energy Draw: 50 kW (50 EC/s continuous)
//    - Operating Temperature: ~1250 K (977 °C)
//    - Feed Throughput: 0.150 unit/s Regolith (~0.240 kg/s)
//    - Refined Yield: 0.012 unit/s Aluminium (~0.0332 kg/s)
//
//  Mode 5: Regolith Pyrolysis (Polymers) [Route 2]
//    - Process: regolith volatile polymer pyrolysis (_PolymerPyrolysis)
//    - Thermal Energy Draw: 35 kW (35 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.3125 unit/s Regolith (~0.500 kg/s) + 0.0005 unit/s Water
//    - Refined Yield: 0.0005 unit/s Polymers (~0.0005 kg/s) + 0.80 unit/s Oxygen (dump)
//
//  Mode 6: Heavy Metal Smelting (Lead)
//    - Process: heavy metal lead smelter (_LeadSmelter)
//    - Thermal Energy Draw: 35 kW (35 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.100 unit/s Regolith (~0.160 kg/s)
//    - Refined Yield: 0.001 unit/s Lead (~0.01134 kg/s)
// =================================================================================

// =================================================================================
//  Sandcastle 1.25m Compact Space Smelter (wbiELMiniSmelter)
//  Includes Route 2: Compact Regolith Volatile Pyrolysis (25% Capacity Scaling)
//  Profile: KerbalismSupport (0.25 Capacity)
//
//  Dry Mass: 1,875 kg
//  Diameter: 1.25 m
//  EC Storage: 2,500 EC
//
//  Mode 1: Compact Regolith Smelter (Metal)
//    - Process: carbothermal metal smelter (_MetalSmelter)
//    - Thermal Energy Draw: 11.25 kW (11.25 EC/s continuous)
//    - Operating Temperature: ~1500 K (1227 °C)
//    - Feed Throughput: 0.025 unit/s Regolith (~0.040 kg/s)
//    - Refined Yield: 0.00075 unit/s Metal (~0.00585 kg/s)
//
//  Mode 2: Compact Trace Refining (Rare Metals)
//    - Process: molten salt rare metals smelter (_RareMetalsSmelter)
//    - Thermal Energy Draw: 18.75 kW (18.75 EC/s continuous)
//    - Operating Temperature: ~1800 K (1527 °C)
//    - Feed Throughput: 0.250 unit/s Regolith (~0.400 kg/s)
//    - Refined Yield: 0.00025 unit/s RareMetals (~0.00195 kg/s)
//
//  Mode 3: Compact Silicate Reduction (Silicon)
//    - Process: silicate reduction silicon smelter (_SiliconSmelter)
//    - Thermal Energy Draw: 15.0 kW (15.0 EC/s continuous)
//    - Operating Temperature: ~1700 K (1427 °C)
//    - Feed Throughput: 0.050 unit/s Regolith (~0.080 kg/s)
//    - Refined Yield: 0.005 unit/s Silicon (~0.01165 kg/s)
//
//  Mode 4: Compact Alumina Electrolysis (Aluminium)
//    - Process: alumina electrolysis aluminium smelter (_AluminiumSmelter)
//    - Thermal Energy Draw: 12.5 kW (12.5 EC/s continuous)
//    - Operating Temperature: ~1250 K (977 °C)
//    - Feed Throughput: 0.0375 unit/s Regolith (~0.060 kg/s)
//    - Refined Yield: 0.003 unit/s Aluminium (~0.0083 kg/s)
//
//  Mode 5: Compact Regolith Pyrolysis (Polymers) [Route 2]
//    - Process: regolith volatile polymer pyrolysis (_PolymerPyrolysis)
//    - Thermal Energy Draw: 8.75 kW (8.75 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.078125 unit/s Regolith (~0.125 kg/s) + 0.000125 unit/s Water
//    - Refined Yield: 0.000125 unit/s Polymers (~0.000125 kg/s) + 0.20 unit/s Oxygen (dump)
//
//  Mode 6: Compact Heavy Metal Smelting (Lead)
//    - Process: heavy metal lead smelter (_LeadSmelter)
//    - Thermal Energy Draw: 8.75 kW (8.75 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.025 unit/s Regolith (~0.040 kg/s)
//    - Refined Yield: 0.00025 unit/s Lead (~0.002835 kg/s)
// =================================================================================
Profile
{
	name = KerbalismSupport
	modname = Sandcastle
	moddir = WildBlueIndustries/Sandcastle

	// --- Supply Notifications ---
	Supply
	{
		resource = Regolith
		low_message = Regolith is almost depleted on $VESSEL@<i>Smelting operations will soon halt</i>
		empty_message = There is no more Regolith on $VESSEL@<i>Smelting operations have halted</i>
		refill_message = $VESSEL Regolith storage refilled@<i>Smelting operations ready</i>
	}

	Supply
	{
		resource = Metal
		low_message = Metal storage is almost full on $VESSEL
		empty_message = Metal storage is full on $VESSEL@<i>Smelting operations halted</i>
		refill_message = $VESSEL Metal storage offloaded
	}

	Supply
	{
		resource = RareMetals
		low_message = Rare Metals storage is almost full on $VESSEL
		empty_message = Rare Metals storage is full on $VESSEL@<i>Trace refining halted</i>
		refill_message = $VESSEL Rare Metals storage offloaded
	}

	Supply
	{
		resource = Silicon
		low_message = Silicon storage is almost full on $VESSEL
		empty_message = Silicon storage is full on $VESSEL@<i>Silicate reduction halted</i>
		refill_message = $VESSEL Silicon storage offloaded
	}

	Supply
	{
		resource = Aluminium
		low_message = Aluminium storage is almost full on $VESSEL
		empty_message = Aluminium storage is full on $VESSEL@<i>Alumina electrolysis halted</i>
		refill_message = $VESSEL Aluminium storage offloaded
	}

	Supply
	{
		resource = Polymers
		low_message = Polymers storage is almost full on $VESSEL
		empty_message = Polymers storage is full on $VESSEL@<i>Polymer pyrolysis halted</i>
		refill_message = $VESSEL Polymers storage offloaded
	}

	Supply
	{
		resource = Lead
		low_message = Lead storage is almost full on $VESSEL
		empty_message = Lead storage is full on $VESSEL@<i>Heavy metal smelting halted</i>
		refill_message = $VESSEL Lead storage offloaded
	}

	// --- Processes ---
	Process
	{
		name = carbothermal metal smelter
		modifier = _MetalSmelter
		input = ElectricCharge@45.0
		input = Regolith@0.100
		output = Metal@0.003
	}

	Process
	{
		name = molten salt rare metals smelter
		modifier = _RareMetalsSmelter
		input = ElectricCharge@75.0
		input = Regolith@1.000
		output = RareMetals@0.001
	}

	Process
	{
		name = silicate reduction silicon smelter
		modifier = _SiliconSmelter
		input = ElectricCharge@60.0
		input = Regolith@0.200
		output = Silicon@0.020
	}

	Process
	{
		name = alumina electrolysis aluminium smelter
		modifier = _AluminiumSmelter
		input = ElectricCharge@50.0
		input = Regolith@0.150
		output = Aluminium@0.012
	}

	Process
	{
		name = regolith volatile polymer pyrolysis
		modifier = _PolymerPyrolysis
		input = ElectricCharge@35.0
		input = Regolith@0.3125
		input = Water@0.0005
		output = Polymers@0.0005
		output = Oxygen@0.80
		dump_valve = Oxygen
	}

	Process
	{
		name = heavy metal lead smelter
		modifier = _LeadSmelter
		input = ElectricCharge@35.0
		input = Regolith@0.100
		output = Lead@0.001
	}
}

