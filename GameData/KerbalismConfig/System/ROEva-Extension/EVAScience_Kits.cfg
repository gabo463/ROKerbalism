    category = Science
    subcategory = 0
    title = EVA Precision Gravimeter Kit
    manufacturer = Kerbal Field Sciences Co.
    description = Portable EVA science kit. The Kerbal performs this experiment while carrying the kit in EVA inventory; the kit is not a deployed ground experiment.

