@PART[fft-nuclear-smelter-375-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleResourceConverter],* {}
    !MODULE[ModuleSystemHeatConverter],* {}

    // 1. Process: Fission Pellet Manufacturing
    MODULE
    {
        name = ProcessController
        resource = _FissionPelletMfg
        title = Fission Pellet Fabricator
        capacity = 10.0
        running = false
        toggle = true
        
        INPUT_RESOURCE
        {
            name = EnrichedUranium
            rate = 0.00005 // 50 uL/s fissile target feed
        }
        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 15000.0 // 15 MW laser micro-machining load
        }
        OUTPUT_RESOURCE
        {
            name = FissionPellets
            rate = 0.00005
            dump = false
        }
    }

    // 2. Process: Fusion Pellet Manufacturing
    MODULE
    {
        name = ProcessController
        resource = _FusionPelletMfg
        title = Fusion Pellet Fabricator
        capacity = 10.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = LqdDeuterium
            rate = 0.0001
        }
        INPUT_RESOURCE
        {
            name = LqdHe3
            rate = 0.0001
        }
        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 12000.0 // 12 MW cryogenic ICF capsule fill load
        }
        OUTPUT_RESOURCE
        {
            name = FusionPellets
            rate = 0.0002
            dump = false
        }
    }

    // 3. Process: Nuclear Salt Water Synthesis (EnrichedUranium + Water -> NuclearSaltWater)
    MODULE
    {
        name = ProcessController
        resource = _NSWSynthesis
        title = Nuclear Salt Water Processor
        capacity = 10.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = EnrichedUranium
            rate = 0.0002 // Uranyl Nitrate solute feed
        }
        INPUT_RESOURCE
        {
            name = Water
            rate = 0.0008 // Aqueous solvent feed
        }
        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 18000.0 // 18 MW thermal dissolution, continuous mixing, and active boron-neutron dampening load
        }
        OUTPUT_RESOURCE
        {
            name = NuclearSaltWater
            rate = 0.0010 // Yields 1.0 mL/s of homogeneous aqueous NSWR fuel
            dump = false
        }
    }

    // 4. Process: Deuterium Production (Water Isotope Separation)
    MODULE
    {
        name = ProcessController
        resource = _DeuteriumProduction
        title = Deuterium Separator
        capacity = 10.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = Water
            rate = 0.0100 // Water feedstock for fractional distillation/electrolysis
        }
        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 10000.0 // 10 MW heavy water separation and cryogenic liquefaction load
        }
        OUTPUT_RESOURCE
        {
            name = LqdDeuterium
            rate = 0.0002 // Liquid deuterium yield
            dump = false
        }
    }

    // 5. Process: Tritium Production (Lithium Irradiation / Breeding)
    MODULE
    {
        name = ProcessController
        resource = _TritiumProduction
        title = Tritium Breeder
        capacity = 10.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = Lithium
            rate = 0.0002 // Lithium target feed for neutron capture
        }
        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 14000.0 // 14 MW neutron flux and thermal extraction load
        }
        OUTPUT_RESOURCE
        {
            name = LqdTritium
            rate = 0.0002 // Liquefied tritium yield
            dump = false
        }
    }
}

@PART[fft-regolith-scoop-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleSystemHeatHarvester],* {}
    // Process 1: Bulk Regolith Surface Harvester
    MODULE
    {
        name = Harvester
        title = Regolith Surface Scraper
        type = 0                  // 0 = Surface crustal harvesting
        resource = Regolith
        min_abundance = 0.00005     // Minimum 0.005% surface concentration required
        rate = 0.05              // 0.05 units/s bulk extraction
        ec_rate = 2500.0         // 2.5 MW continuous power draw
    }

    // Process 2: Direct Volatile Pyrolysis (Helium-3 Surface Extractor)
    MODULE
    {
        name = Harvester
        title = Surface He-3 Volatile Extractor
        type = 0                  
        resource = LqdHe3
        min_abundance = 0.00005  // Extracts trace solar-wind deposits
        rate = 0.0001            // Cryogenic yield rate
        ec_rate = 3500.0         // 3.5 MW for high-temperature pyrolysis
    }
}

