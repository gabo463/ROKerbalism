@PART[fft-nuclear-smelter-375-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleSystemHeatConverter],* {}

	MODULE
	{
		name = ProcessController
		resource = _FissionPelletMfg
		title = Fission Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FissionParticleMfg
		title = Fission Particle Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FusionPelletMfg
		title = Fusion Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _NSWSynthesis
		title = Nuclear Salt Water Processor
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _DeuteriumProduction
		title = Deuterium Separator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _TritiumProduction
		title = Tritium Breeder
		capacity = 10.0
	}

	MODULE
	{
		name = Configure
		title = Nuclear Smelter
		slots = 2

		SETUP
		{
			name = Fission Pellet Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionPelletMfg
			}
		}

		SETUP
		{
			name = Fission Particle Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionParticles</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionParticleMfg
			}
		}

		SETUP
		{
			name = Fusion Pellet Fabricator
			desc = Process <b>LqdDeuterium</b> and <b>LqdHe3</b> into <b>FusionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FusionPelletMfg
			}
		}

		SETUP
		{
			name = Nuclear Salt Water Processor
			desc = Mix <b>EnrichedUranium</b> and <b>Water</b> into <b>NuclearSaltWater</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NSWSynthesis
			}
		}

		SETUP
		{
			name = Deuterium Separator
			desc = Extract <b>LqdDeuterium</b> from <b>Water</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _DeuteriumProduction
			}
		}

		SETUP
		{
			name = Tritium Breeder
			desc = Breed <b>LqdTritium</b> from <b>Lithium</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _TritiumProduction
			}
		}
	}
}


@PART[fft-regolith-scoop-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleSystemHeatHarvester],* {}
    // Process 1: Bulk Regolith Surface Harvester
    MODULE
    {
        name = Harvester
        title = Regolith Surface Scraper
        type = 0                  // 0 = Surface crustal harvesting
        resource = Regolith
        min_abundance = 0.00005     // Minimum 0.005% surface concentration required
        rate = 0.05              // 0.05 units/s bulk extraction
        ec_rate = 2500.0         // 2.5 MW continuous power draw
    }

    // Process 2: Direct Volatile Pyrolysis (Helium-3 Surface Extractor)
    MODULE
    {
        name = Harvester
        title = Surface He-3 Volatile Extractor
        type = 0                  
        resource = LqdHe3
        min_abundance = 0.00005  // Extracts trace solar-wind deposits
        rate = 0.0001            // Cryogenic yield rate
        ec_rate = 3500.0         // 3.5 MW for high-temperature pyrolysis
    }
}

@PART[fft-regolith-scoop-2]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleSystemHeatHarvester],* {}

    // Process 1: Heavy Industrial Regolith Harvester
    MODULE
    {
        name = Harvester
        title = Heavy Regolith Excavator
        type = 0                  
        resource = Regolith
        min_abundance = 0.00005
        rate = 0.20             
        ec_rate = 6500.0        
    }

    // Process 2: Heavy In-Situ Volatile Extraction (Helium-3 Pyrolysis)
    MODULE
    {
        name = Harvester
        title = Heavy He-3 Volatile Extractor
        type = 0                  // 0 = Surface crustal harvesting
        resource = LqdHe3
        min_abundance = 0.00005   // Minimum 0.005% surface concentration required
        rate = 0.0004            // High-throughput cryogenic yield
        ec_rate = 10000.0        // 10.0 MW continuous pyrolysis & thermal fluidization
    }
}

@PART[fft-antimatter-factory-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleResourceConverter],* {}
    !MODULE[ModuleSystemHeatConverter],* {}

    // Mode 1: High-energy Pair Production via Liquid Hydrogen
    MODULE
    {
        name = ProcessController
        resource = _AntimatterLH2
        title = Antimatter Synthesis (LH2)
        capacity = 1.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 120000.0 
        }
        INPUT_RESOURCE
        {
            name = LiquidHydrogen
            rate = 12.5 
        }
        OUTPUT_RESOURCE
        {
            name = Antimatter
            rate = 0.0125 
            dump = false
        }
    }

    // Mode 2: Fission Pellet-catalyzed Antimatter Production
    MODULE
    {
        name = ProcessController
        resource = _AntimatterPellets
        title = Antimatter Synthesis (Fission Pellets)
        capacity = 1.0
        running = false
        toggle = true

        INPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 45000.0 
        }
        INPUT_RESOURCE
        {
            name = FissionPellets
            rate = 0.05
        }
        OUTPUT_RESOURCE
        {
            name = Antimatter
            rate = 0.025 
            dump = false
        }
    }
}