
Profile
{
	name = KerbalismSupport
	modname = Far Future Technologies
	moddir = FarFutureTechnologies

	Supply
	{
		resource = FissionPellets
		low_message = Fission Pellets are running low on $VESSEL@<i>Fission engines will soon be offline</i>
		empty_message = No more Fission Pellets on $VESSEL@<i>Fission engines are offline</i>
		refill_message = $VESSEL Fission Pellets refilled
	}

	Supply
	{
		resource = FusionPellets
		low_message = Fusion Pellets are running low on $VESSEL@<i>Fusion engines will soon be offline</i>
		empty_message = No more Fusion Pellets on $VESSEL@<i>Fusion engines are offline</i>
		refill_message = $VESSEL Fusion Pellets refilled
	}

	Supply
	{
		resource = NuclearSaltWater
		low_message = Nuclear Salt Water is running low on $VESSEL@<i>NSWR engines will soon be offline</i>
		empty_message = No more Nuclear Salt Water on $VESSEL@<i>NSWR engines are offline</i>
		refill_message = $VESSEL Nuclear Salt Water refilled
	}

    Supply
	{
		resource = LqdDeuterium
		low_message = Deuterium is running low on $VESSEL@<i>Fusion engines will soon be offline</i>
		empty_message = No more Deuterium on $VESSEL@<i>Fusion engines are offline</i>
		refill_message = $VESSEL Deuterium refilled
	}

    Supply
	{
		resource = FissionParticles
		low_message = Fission Particles are running low on $VESSEL@<i>Fusion engines will soon be offline</i>
		empty_message = No more Fission Particles on $VESSEL@<i>Fusion engines are offline</i>
		refill_message = $VESSEL Fission Particles refilled
	}
    Supply
	{
		resource = LqdTritium
		low_message = Tritium is running low on $VESSEL@<i>Fusion engines will soon be offline</i>
		empty_message = No more Tritium on $VESSEL@<i>Fusion engines are offline</i>
		refill_message = $VESSEL Tritium refilled
	}

	// 1. Fission Pellet Manufacturing
	Process
	{
		name = fission pellet fabricator
		modifier = _FissionPelletMfg
		input = ElectricCharge@5000.0
		input = EnrichedUranium@0.0005
		output = FissionPellets@0.0005
	}

	// 2. Fission Particles Manufacturing
	Process
	{
		name = fission particle fabricator
		modifier = _FissionParticleMfg
		input = ElectricCharge@6000.0
		input = EnrichedUranium@0.0005
		output = FissionParticles@0.0005
	}

	// 3. Fusion Pellet Manufacturing
	Process
	{
		name = fusion pellet fabricator
		modifier = _FusionPelletMfg
		input = ElectricCharge@3500.0
		input = LqdDeuterium@0.002
		input = LqdHe3@0.002
		output = FusionPellets@0.004
	}

	// 4. Nuclear Salt Water Synthesis
	Process
	{
		name = nuclear salt water processor
		modifier = _NSWSynthesis
		input = ElectricCharge@2500.0
		input = EnrichedUranium@0.001
		input = Water@0.004
		output = NuclearSaltWater@0.005
	}

	// 5. Deuterium Production
	Process
	{
		name = deuterium separator
		modifier = _DeuteriumProduction
		input = ElectricCharge@1500.0
		input = Water@0.200
		output = LqdDeuterium@0.003
	}

	// 6. Tritium Production
	Process
	{
		name = tritium breeder
		modifier = _TritiumProduction
		input = ElectricCharge@4000.0
		input = Lithium@0.002
		output = LqdTritium@0.002
	}
}

