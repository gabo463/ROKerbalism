// =====================================================================
// 001_EVAScience_SuitInventory.cfg
// ---------------------------------------------------------------------
// Gives EVA kerbals extra inventory room so they can carry 2 science
// kits on top of their default gear (parachute + jetpack already eat
// most of the stock 40L / 0.065t allowance).
//
// IMPORTANT: RO/RP-1 often renames or replaces the stock EVA parts
// (via a suits mod). Check your GameData/ModuleManager.ConfigCache
// for the real part name(s) before relying on this - search for
// "ModuleInventoryPart" inside a PART node whose name contains "EVA".
// Edit the part name list below to match what you actually have.
// =====================================================================

@PART[kerbalEVA|kerbalEVAfemale|kerbalEVAVintage|kerbalEVAexpedition|kerbalEVAfemaleExpedition]:FINAL
{
	@MODULE[ModuleInventoryPart]
	{
		// stock default is 2 slots / 40L, already used by chute + jetpack.
		// bump both up enough for 2 science kits (~12L / ~1kg each, see
		// 002 file) without turning the kerbal into a pack mule.
		@InventorySlots = 4
		@packedVolumeLimit = 65
		@massLimit = 0.5
	}
}

