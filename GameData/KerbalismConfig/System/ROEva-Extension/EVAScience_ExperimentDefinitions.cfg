
EXPERIMENT_DEFINITION
{
	id = evaXRFScan
	title = X-Ray Fluorescence Kit
	description = Bombards a rock or soil sample with X-rays to identify its elemental composition on the spot.
	baseValue = 10
	scienceCap = 10
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 0

	RESULTS
	{
		default = The X-ray fluorescence readings reveal the elemental makeup of local rock and soil, updating our geological survey of the area.
	}

