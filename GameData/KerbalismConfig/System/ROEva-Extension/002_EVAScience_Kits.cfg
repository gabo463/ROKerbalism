// =====================================================================
// 002_EVAScience_Kits.cfg
// ---------------------------------------------------------------------
// Each experiment is a small standalone PART (a "kit") with:
//   - ModuleCargoPart      -> so it can sit in an EVA/container inventory
//   - Experiment (Kerbalism) -> hooks it into the Kerbalism science sim
//   - ModuleScienceExperiment (stock) is intentionally NOT added -
//     Kerbalism's Experiment module replaces it entirely.
//
// Workflow in-game (no ground placement, ever):
//   1. Kerbal grabs a kit from the Container (or has one
//      already in their suit inventory).
//   2. While it's still sitting stowed in the kerbal's inventory, the
//      kerbal triggers it directly from their OWN part-action window -
//      exactly like the stock "EVA Experiments Kit" (right-click the
//      kerbal on EVA -> the kit's action shows up there, not on a
//      separate placed object).
//   3. Kerbalism's Experiment module runs its checks (crew_operate,
//      situation requirements, EC drain) via its own background
//      simulation loop rather than needing a live placed part - so it
//      keeps recording/producing data or filling a sample while the
//      kerbal just stands there (or walks around, for instant-reading
//      experiments).
//   4. Once finished, the kit is either consumed (physical sample,
//      stays in inventory full until returned/analyzed) or its data
//      gets written straight to a HardDrive on the vessel/container -
//      no separate "collect from the ground" step.
//   5. Kerbal walks to the Container, drops the used/full kit in,
//      grabs a fresh one, moves on.
//
// FULL WORKED EXAMPLE: Seismometer -----------------------------------
// =====================================================================

PART
{
	name = evaScienceKit_Seismometer
	module = Part
	author = YourName

	MODEL
	{
		model = Squad/Parts/Cargo/ScienceKit/ExperimentKit 
	}
	rescaleFactor = 1

	node_attach = 0, 0, 0, 0, 1, 0, false

	TechRequired = fieldScience
	entryCost = 3200
	cost = 800
	category = Science
	subcategory = 0
	title = EVA Seismometer Kit
	manufacturer = Kerbal Field Sciences Co.
	description = A portable, deployable seismometer. Place it on the surface, walk away, and let it listen. Ideally deploy several across a landing site for a proper seismic network.

	attachRules = 1,0,0,0,0
	mass = 0.9
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 8
	maxTemp = 500
	bulkheadProfiles = srf

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 12   // liters
	}

	MODULE
	{
		name = Experiment

		experiment_id          = evaSeismicScan
		experiment_desc         = A single-station seismic reading - roughly 20 minutes of listening, like a portable field seismic survey.
		data_rate               = 0.005     // 6 Mb / 1200s (20 min) - see 004_EVAScience_ExperimentDefinitions.cfg
		ec_rate                 = 0.01      // 12 EC total over the reading
		sample_mass             = 0         // transmissible, not a physical sample
		science_cap             = 1.2

		// runs directly off the kerbal while the kit sits in their
		// inventory - no placement, no separate "arm it" step.
		crew_operate = true      // kerbal must be present/EVA to run it
		crew_prepare =
		crew_reset   =

		// restrict to solid surfaces, not deep space or splashed
		requires = Surface,!Ocean
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 50
		maxAmount = 50
	}
}

// =====================================================================
// TEMPLATES - copy the block above and adjust these fields per kit.
// Fill in TechRequired/cost/mass/description/model to taste; the
// experiment_id values below are suggestions, not existing stock IDs -
// you'll need matching EXPERIMENT_DEFINITION nodes (Squad-style, in a
// separate Experiments.cfg) for each new one. Kerbalism reads whichever
// EXPERIMENT_DEFINITION exists with that ID for the base science value/
// biome behavior, then layers its own requires/crew/ec_rate on top.
// =====================================================================

/*
2) Magnetometer Boom
   experiment_id = evaMagnetometerScan
   sample_mass   = 0            (transmissible)
   requires      = Surface
   crew_operate  = true
   Good for: crustal magnetic field mapping, differs meaningfully by body/biome.

3) Regolith / Soil Sample Kit
   experiment_id = evaRegolithSample
   sample_mass   = 0.25         (PHYSICAL sample - cannot transmit, must be
                                  physically returned or run through a Lab)
   sample_collecting = true
   requires      = Surface
   crew_operate  = true         (needs a kerbal actively scooping)
   Good for: classic "grab dirt, bring it home or to the lab" gameplay -
   this is the one that most benefits from your container/swap loop,
   since a kerbal can fill several sample kits across a traverse.

4) Micrometeorite Impact Plate
   experiment_id = evaMicrometeoriteScan
   sample_mass   = 0
   requires      = Surface,!Atmosphere       (airless bodies only - the
                                               whole point is no atmo to
                                               burn particles up)
   crew_operate  = true          (runs directly off the kerbal, in
                                   inventory, same as the seismometer -
                                   give it a slow data_rate so it takes
                                   a while rather than being truly
                                   instant, encouraging a longer EVA)
   Good for: a "stand around and let it accumulate" reading without
   ever leaving the kerbal's pocket.

5) Heat Flow Probe
   experiment_id = evaHeatFlowScan
   sample_mass   = 0
   requires      = Surface
   crew_operate  = true
   crew_reset    = Scientist    (only a Scientist can properly interpret
                                  a re-run if the first pass got interrupted)
   Good for: needs a drilled hole conceptually - could require a "Drill"
   part tag be present on the same kit stack if you want extra flavor.

6) Radiation Dosimeter
   experiment_id = evaRadDosimeter
   sample_mass   = 0
   requires      =              (works everywhere, incl. cislunar/interplanetary)
   crew_prepare  = true
   Good for: pairs naturally with Kerbalism's existing radiation model -
   science value could scale with RadiationMin/RadiationMax requirement
   tiers (weak signal in low rad zones, jackpot near Van Allen belts).

7) Atmospheric Gas Analyzer
   experiment_id = evaAtmoAnalysis
   sample_mass   = 0.15         (sample - needs a sealed capture)
   requires      = Atmosphere
   crew_operate  = true
   Good for: Eve/Duna/Laythe/Jool-adjacent bodies only, naturally excluded
   everywhere airless via the requires filter.

8) Gravimeter
   experiment_id = evaGravimeterScan
   sample_mass   = 0
   requires      = Surface
   crew_operate  = Scientist@1  (needs at least a 1-star Scientist to
                                  operate it correctly - fine instrument,
                                  runs straight from inventory like the rest)
   Good for: giving Scientists an experiment nobody else can even run,
   which is a config-only way to make them feel special without touching
   inventory slot counts.
*/
